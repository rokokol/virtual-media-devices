name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31

      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }

      - run: nix build --no-write-lock-file .#virtual-cam .#virtual-mic
      # tests, package-smoke, package-settings, module-wiring, nixos-eval, scripts-lint,
      # installer-suite. Nothing here loads a kernel module: the checks are either
      # eval-level or run against stubs
      - run: nix flake check --no-write-lock-file

      # The full installer contract lives in tests/installer.sh (run by flake check);
      # this is the smoke that the same script behaves on a real filesystem, and that
      # the behaviour suite passes against the installed copies. Under nix develop: the
      # runner is not a target distribution, so the preflight's runtime deps (ffmpeg,
      # v4l2-ctl, pactl) come from the flake's lock — the honest install-by-guidance
      # path is the distro suite's job
      - name: install.sh works
        run: |
          nix develop --no-write-lock-file --command bash -euo pipefail -c '
          PREFIX=$PWD/out ./install.sh
          test -L out/bin/virtual-cam
          test -L out/bin/virtual-mic
          test -f out/share/virtual-media-devices/install-manifest
          VIRTUAL_CAM=$PWD/out/bin/virtual-cam VIRTUAL_MIC=$PWD/out/bin/virtual-mic ./tests/run.sh
          PREFIX=$PWD/out ./install.sh --uninstall --component mic
          test ! -e out/bin/virtual-mic
          test -L out/bin/virtual-cam
          PREFIX=$PWD/out ./install.sh --uninstall
          test ! -e out/share/virtual-media-devices
          test ! -e out/bin/virtual-cam
          PREFIX=/usr ./install.sh --destdir "$PWD/stage-cam" --component cam
          test -L stage-cam/usr/bin/virtual-cam
          test ! -e stage-cam/usr/bin/virtual-mic
          DESTDIR=$PWD/stage-mic PREFIX=/usr ./install.sh --component mic
          test ! -e stage-mic/usr/bin/virtual-cam
          test -L stage-mic/usr/bin/virtual-mic
          # if-form, not `! cmd`: -e ignores negated pipelines, so a `! cmd` line only
          # bites while it happens to be the last one — anyone appending disarms it
          if DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1; then
            echo "a relative PREFIX was accepted" >&2
            exit 1
          fi
          '

      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # nix run/shell nixpkgs#tool is a mirror-fate lookup — whatever nixpkgs the runner
      # resolves today decides the job. Tools a workflow needs live in the flake's dev
      # shell, pinned by the lock, reached with nix develop
      # Every vendored copy is byte-equal to its source: one edited here instead of at the
      # source fails by name — see .github/vendor.lock
      - name: vendored copies are byte-equal to their source
        run: ./vendor-sync.sh check
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
